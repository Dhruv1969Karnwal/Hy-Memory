name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "hy_memory/**"
      - "tests/**"
      - "plugins/**"
      - "docs/**"
      - "pyproject.toml"
      - "memhub/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "hy_memory/**"
      - "tests/**"
      - "plugins/**"
      - "docs/**"
      - "pyproject.toml"
      - "memhub/**"

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra faiss --extra qdrant
      - run: uv run pytest tests/ -q -o log_cli=false

  memhub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memhub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: memhub/apps/core/uv.lock
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/core --all-groups --locked
      - run: pnpm check
