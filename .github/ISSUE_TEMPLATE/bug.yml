name: Bug
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: textarea
    id: impact
    attributes:
      label: User Impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Platform
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and Actual Results
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Confirmation
      options:
        - label: The content contains no secrets, real conversations, or personal information
          required: true
